name: Playwright CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_portfolio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qa_portfolio"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout application under test
        uses: actions/checkout@v5
        with:
          repository: KSely/QA-Automation-Portfolio
          path: qa-automation-portfolio

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            qa-automation-portfolio/package-lock.json

      - name: Install Playwright project dependencies
        run: npm ci

      - name: Install application dependencies
        working-directory: qa-automation-portfolio
        run: npm ci

      - name: Create test configuration
        run: |
          cp .env.example .env
          sed -i 's/DB_PASSWORD=your_database_password/DB_PASSWORD=postgres/' .env

      - name: Create application environment
        working-directory: qa-automation-portfolio
        run: |
          cp .env.example .env
          sed -i 's/DB_PASSWORD=your_password/DB_PASSWORD=postgres/' .env

      - name: Create database schema
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d qa_portfolio \
            -c "CREATE TABLE IF NOT EXISTS messages (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              email VARCHAR(255) NOT NULL,
              message TEXT NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );"

      - name: Start application under test
        working-directory: qa-automation-portfolio
        run: |
          npm start > app.log 2>&1 &

      - name: Verify application is running
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/api/status; then
              exit 0
            fi
            sleep 2
          done
          cat qa-automation-portfolio/app.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API tests
        run: npm run test:api

      - name: Run database tests
        run: npm run test:db

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run UI tests
        run: npm run test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7